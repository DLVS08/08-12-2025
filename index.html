<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>08-12-2025 — A Small Surprise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">

    <!-- PASSWORD SECTION -->
    <section id="passwordSection" class="center">
      <div class="password-wrap">
        <p class="hint">Enter the password to open your surprise 💝</p>
        <input type="text" id="passwordInput" placeholder="Type password here" />
        <button type="button" id="passwordBtn" class="btn">Unlock</button>
        <p id="passwordError" class="muted" style="display:none;margin-top:8px;">Incorrect password. Try again.</p>
      </div>
    </section>

    <!-- Intro / Gift box -->
    <section id="intro" class="center hidden">
      <div id="giftWrap" class="gift-wrap" role="button" aria-label="Open the gift">
        <div class="box">
          <div class="lid"></div>
          <div class="body"></div>
          <div class="ribbon"></div>
        </div>
        <p class="hint">Tap the box to open your surprise, Madam Ji 💝</p>
      </div>
    </section>

    <!-- Photo sequence -->
    <section id="sequence" class="center hidden">
      <div class="photo-card" style="position:relative;">
        <img id="photoImg" src="" alt="photo" />
        <div id="photoMsg" class="photo-msg"></div>
      </div>

      <!-- Photo crop editor (hidden until triggered) -->
      <div id="cropEditor" class="hidden" style="position:relative;max-width:760px;margin:12px auto;background:#f7f7f7;padding:10px;border-radius:8px;">
        <div id="cropBox" style="position:absolute;top:0;left:0;border:2px dashed var(--accent);background:rgba(255,123,156,0.2);touch-action:none;"></div>
        <div style="margin-top:180px;text-align:center;display:flex;gap:8px;flex-wrap:wrap;">
          <input id="cropWidth" type="number" placeholder="Width px"/>
          <input id="cropHeight" type="number" placeholder="Height px"/>
          <input id="cropX" type="number" placeholder="X %"/>
          <input id="cropY" type="number" placeholder="Y %"/>
          <button id="cropApply" class="btn">Apply</button>
          <button id="cropClose" class="btn outline">Close</button>
        </div>
      </div>

      <div class="controls">
        <button id="nextBtn" class="btn">Next</button>
      </div>
      <div class="progress" aria-hidden="true">
        <span id="progressText">1 / 4</span>
      </div>
    </section>

    <!-- Final envelope & letter -->
    <section id="letterSection" class="center hidden">
      <div id="envelopeWrap" class="envelope-wrap" role="button" aria-label="Open the letter">
        <div class="envelope">
          <div class="flap"></div>
          <div class="paper"></div>
        </div>
        <p class="hint">Tap the envelope to read my letter</p>
      </div>

      <div id="letterCard" class="letter-card hidden">
        <h2>A Letter For You</h2>
        <div id="letterText" class="letter-text"></div>
        <div class="actions">
          <button id="replayLetter" class="btn outline">Replay Letter</button>
        </div>
      </div>
    </section>

    <footer class="center muted">With quiet courage — Yours.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
