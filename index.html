<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>08-12-2025 — A Small Surprise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <!-- PASSWORD SECTION -->
    <section id="passwordSection" class="center">
      <div class="password-wrap">
        <p class="hint">Enter the password to open your surprise 💝</p>
        <input type="text" id="passwordInput" placeholder="Type password here" />
        <button type="button" id="passwordBtn" class="btn">Unlock</button>
        <p id="passwordError" class="muted" style="display:none;margin-top:8px;">Incorrect password. Try again.</p>
      </div>
    </section>

    <footer class="center muted">With quiet courage — Yours.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
