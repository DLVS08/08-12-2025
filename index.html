<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>08-12-2025 — A Small Surprise</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">

    <!-- PASSWORD SECTION -->
    <section id="passwordSection" class="center">
      <div class="password-wrap">
        <p class="hint">Enter the password to open your surprise 💝</p>
        <input type="text" id="passwordInput" placeholder="Type password here" />
        <button type="button" id="passwordBtn" class="btn">Unlock</button>
        <p id="passwordError" class="muted" style="display:none;margin-top:8px;">Incorrect password. Try again.</p>
      </div>
    </section>

    <!-- CELEBRATION SECTION -->
    <section id="celebration" class="center hidden">
      <div id="confettiContainer"></div>
      <div id="emojiContainer"></div>

      <div class="cake-wrap">
        <div class="cake">
          <div class="plate"></div>
          <div class="layer layer-bottom"></div>
          <div class="layer layer-middle"></div>
          <div class="layer layer-top"></div>
          <div class="candles">
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
            <div class="candle"><div class="flame"></div></div>
          </div>
        </div>
        <p class="hint" id="makeWishText" style="display:none;">Make a wish… 💫</p>
        <button id="blowCandlesBtn" class="btn">Blow the Candles 🎤</button>
      </div>
    </section>

    <!-- INTRO / GIFT BOX -->
    <section id="intro" class="center hidden">
      <div id="giftWrap" class="gift-wrap" role="button" aria-label="Open the gift">
        <div class="box">
          <div class="lid"></div>
          <div class="body"></div>
          <div class="ribbon"></div>
        </div>
        <p class="hint">Tap the box to open your surprise, Madam Ji 💝</p>
      </div>
    </section>

    <!-- PHOTO SEQUENCE -->
    <section id="sequence" class="center hidden">
      <div class="photo-card">
        <img id="photoImg" src="" alt="photo" />
        <div id="photoMsg" class="photo-msg"></div>
      </div>

      <div class="controls">
        <button id="nextBtn" class="btn">Next</button>
      </div>
      <div class="progress" aria-hidden="true">
        <span id="progressText">1 / 4</span>
      </div>
    </section>

    <!-- LETTER SECTION -->
    <section id="letterSection" class="center hidden">
      <div id="envelopeWrap" class="envelope-wrap" role="button" aria-label="Open the letter">
        <div class="envelope">
          <div class="flap"></div>
          <div class="paper"></div>
        </div>
        <p class="hint">Tap the envelope to read my letter</p>
      </div>

      <div id="letterCard" class="letter-card hidden">
        <h2>A Letter For You</h2>
        <div id="letterText" class="letter-text"></div>
        <div class="actions">
          <button id="replayLetter" class="btn outline">Replay Letter</button>
        </div>
      </div>
    </section>

    <footer class="center muted">With quiet courage — Yours.</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
